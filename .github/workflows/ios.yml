name: Build iOS IPA (chưa ký)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Dự án chỉ chứa mã Dart; thư mục ios/ được tạo ở đây nếu chưa có.
      - name: Tạo khung iOS nếu chưa có
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.j2meplay --project-name j2meplay .
          fi

      - name: Sao chép lõi C (native/jvmcore) vào plugin jvmcore
        run: |
          mkdir -p packages/jvmcore/ios/Classes
          cp native/jvmcore/jvm.c native/jvmcore/natives.c native/jvmcore/io.c native/jvmcore/midp.c native/jvmcore/png.c native/jvmcore/misc.c native/jvmcore/ui.inc native/jvmcore/net.inc native/jvmcore/timer.inc native/jvmcore/sock.inc native/jvmcore/jvm.h packages/jvmcore/ios/Classes/
          ls packages/jvmcore/ios/Classes

      - run: flutter pub get

      - name: Icon + tên app
        run: ./tool/make_icons.sh

      - name: Cho phép chạy nền (audio) để game chạy ẩn khi mở app khác
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P || true

      - name: Cấu hình Google Sign-In (nếu có GOOGLE_IOS_CLIENT_ID)
        env:
          GID: ${{ vars.GOOGLE_IOS_CLIENT_ID || '104863017124-fhfdvvsmfkni5nq9dim3o0a0fl0jqakl.apps.googleusercontent.com' }}
        run: |
          if [ -n "$GID" ]; then
            REV="com.googleusercontent.apps.${GID%%.apps.googleusercontent.com}"
            P=ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GID" $P || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $P || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $P || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $P || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" $P || true
          fi

      - name: Phân tích Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error|Analyzing|issues" | head -60 || true

      - name: Build (không ký)
        run: flutter build ios --release --no-codesign --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID || '104863017124-fhfdvvsmfkni5nq9dim3o0a0fl0jqakl.apps.googleusercontent.com' }}

      - name: Đóng gói IPA chưa ký
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr J2MEPlay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: J2MEPlay-unsigned-ipa
          path: J2MEPlay-unsigned.ipa

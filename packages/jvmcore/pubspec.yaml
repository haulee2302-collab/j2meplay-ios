name: jvmcore
description: Lõi thông dịch JVM viết bằng C cho J2ME Play (FFI). Mã C nằm ở native/jvmcore, CI sao chép vào ios/Classes khi build.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true

name: jp_pip
description: Hình trong hình (Picture in Picture) cho khung hình giả lập, chỉ iOS.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: JpPipPlugin

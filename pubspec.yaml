name: j2meplay
description: J2ME Play cho iPhone - thuê phiên J2ME, kho JAR, tài khoản (giao diện giống bản Android).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3
  webview_flutter: ^4.9.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1
  file_picker: ^8.1.2
  archive: ^3.6.1
  path_provider: ^2.1.4
  image: ^4.2.0
  audioplayers: ^6.1.0
  jp_pip:
    path: packages/jp_pip

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jp_logo.png
    - assets/silence.wav
